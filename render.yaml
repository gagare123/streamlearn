# ─────────────────────────────────────────────────────────────────────────────
# StreamLearn — Render.com Deployment Configuration
#
# Two services in one repo:
#   1. web       — Next.js 15 App Router (Web Service)
#   2. worker    — Background Worker (tsx worker/index.ts)
#
# Deploy: push to main → Render auto-detects this file.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Web Service ─────────────────────────────────────────────────────────
  - type: web
    name: streamlearn-web
    runtime: node
    region: frankfurt              # closest to Nigeria
    plan: starter                  # upgrade to standard for production
    buildCommand: pnpm install && pnpm build
    startCommand: node .next/standalone/server.js

    # Node.js version
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: PNPM_VERSION
        value: "9.15.0"

      # ── App ───────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        sync: false              # set in Render dashboard

      # ── Database ──────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false              # Supabase PgBouncer pooler :6543
      - key: DATABASE_DIRECT_URL
        sync: false              # Supabase direct :5432 (migrations only)

      # ── Redis ─────────────────────────────────────────────────────────
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── JWT ───────────────────────────────────────────────────────────
      - key: JWT_ACCESS_SECRET
        generateValue: true      # Render generates a random secret
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # ── Mux ───────────────────────────────────────────────────────────
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_WEBHOOK_SECRET
        sync: false

      # ── Cloudflare R2 ─────────────────────────────────────────────────
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

      # ── Paystack ──────────────────────────────────────────────────────
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false

    # Health check — Render uses this to route traffic
    healthCheckPath: /api/health

    # Auto-deploy on push to main
    autoDeploy: true

    # ── Render disk (optional — if you need ephemeral local storage) ───
    # disk:
    #   name: streamlearn-disk
    #   mountPath: /var/data
    #   sizeGB: 1

  # ── Background Worker ────────────────────────────────────────────────────
  - type: worker
    name: streamlearn-worker
    runtime: node
    region: frankfurt              # same region as web service
    plan: starter
    buildCommand: pnpm install
    startCommand: node --loader ts-node/esm worker/index.ts
    # Alternative if tsx is installed:
    # startCommand: pnpm dlx tsx worker/index.ts

    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: PNPM_VERSION
        value: "9.15.0"
      - key: NODE_ENV
        value: production

      # Worker needs DB + Redis + SMTP
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # Worker also needs R2 for certificate generation
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

      # App URL for certificate verify links in emails
      - key: NEXT_PUBLIC_APP_URL
        sync: false

    autoDeploy: true

# ─────────────────────────────────────────────────────────────────────────────
# Notes for deployment:
#
# 1. Set all `sync: false` vars in the Render dashboard under each service's
#    Environment tab before the first deploy.
#
# 2. Run DB migrations BEFORE deploying (from your local machine):
#    DATABASE_URL=<direct_url> pnpm db:migrate
#
# 3. Mux webhook URL: https://your-render-url.onrender.com/api/webhooks/mux
#    Register this in your Mux dashboard → Webhooks.
#
# 4. Paystack webhook URL: https://your-render-url.onrender.com/api/webhooks/paystack
#    Register in Paystack dashboard → Settings → API Keys & Webhooks.
#
# 5. The starter plan has 512MB RAM. If builds fail on OOM, upgrade to standard
#    or add NODE_OPTIONS=--max-old-space-size=450 to the build environment.
# ─────────────────────────────────────────────────────────────────────────────